workerPoolSpecs:
  - machineSpec:
      machineType: a2-highgpu-2g
      acceleratorType: NVIDIA_TESLA_A100
      acceleratorCount: 2
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 400
    containerSpec:
      imageUri: __IMAGE_URI__
      command: [python, -m]
      args: [personas.probe]
scheduling:
  strategy: SPOT
  timeout: 3600s
  restartJobOnWorkerRestart: true
